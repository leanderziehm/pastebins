<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Paste: /{{ slug }}</title>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet"> -->
    <style>
        body {
            font-family: 'Fira Code', monospace;
            max-width: 55vw;
            margin: 2rem auto;
            background: #f9f9fb;
            color: #1a1a1a;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        textarea, input[type="password"] {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f6f6f6;
            resize: vertical;
        }
        button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3730a3;
        }
        label {
            display: block;
            margin-top: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
     <a href="/" >Home</a>
    <h1>Create Paste: /{{ slug }}</h1>
    <form method="post">
        <label for="content">Paste content:</label>
        <textarea name="content" id="content" required placeholder="Paste text here...">{{ content or '' }}</textarea>
        
        <label for="password">Optional password:</label>
        <input type="password" name="password" id="password" placeholder="Protect this paste (optional)">
        
        <button type="submit">Save Paste</button>
    </form>
</body>
</html>
