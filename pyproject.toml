[project]
name = "pastebins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LeanderZiehm", email = "git@leanderziehm.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
pastebins = "pastebins:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
